<!DOCTYPE html>
<html lang="en" class="h-full w-full overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PCI3 — Pigeon Clicker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js for 3D Pigeon rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#F9F6EE',
                        charcoal: '#181A1D',
                        terracotta: '#D95D39',
                        amber: '#E6A11D',
                        brass: '#B8860B',
                        sage: '#6A8A73'
                    },
                    fontFamily: {
                        heading: ['Syne', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    boxShadow: {
                        'retro-lg': '8px 8px 0px 0px #181A1D',
                        'retro-sm': '4px 4px 0px 0px #181A1D',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #F9F6EE;
            background-size: 32px 32px;
            background-image: 
                linear-gradient(to right, rgba(50, 55, 65, 0.22) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(50, 55, 65, 0.22) 1px, transparent 1px);
            touch-action: manipulation;
        }

        .vintage-border {
            border: 3px solid #181A1D;
        }

        .brass-plate {
            background: linear-gradient(135deg, #e5c158 0%, #b8860b 50%, #8a6203 100%);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 4px 8px rgba(0,0,0,0.3);
        }

        .glass-overlay {
            background: linear-gradient(
                135deg, 
                rgba(255, 255, 255, 0.25) 0%, 
                rgba(255, 255, 255, 0.05) 40%, 
                transparent 50%, 
                rgba(255, 255, 255, 0.1) 80%,
                rgba(255, 255, 255, 0.2) 100%
            );
            pointer-events: none;
        }

        .btn-retro {
            transition: all 0.15s ease-out;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-retro:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px 0px #181A1D !important;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #F9F6EE;
            border-left: 2px solid #181A1D;
        }
        ::-webkit-scrollbar-thumb {
            background: #181A1D;
            border-radius: 4px;
        }
    </style>
</head>
<body class="h-full w-full flex flex-col items-center justify-between p-2 sm:p-6 select-none overflow-hidden text-charcoal">

    <!-- TOP HEADER -->
    <header class="w-full max-w-6xl flex items-center justify-between z-10 mb-1 sm:mb-2">
        <div class="flex items-center gap-2 bg-cream vintage-border px-3 py-1.5 rounded-xl shadow-retro-sm">
            <div class="w-6 h-6 bg-terracotta vintage-border rounded-lg flex items-center justify-center text-cream font-heading font-extrabold text-xs">
                P3
            </div>
            <span class="font-mono font-bold text-[10px] sm:text-xs uppercase tracking-wider text-charcoal">PCI3 // Pigeon Engine</span>
        </div>

        <div class="flex items-center gap-2">
            <div class="bg-cream vintage-border px-3 py-1 rounded-xl shadow-retro-sm flex items-center gap-1.5 font-mono text-xs font-bold">
                <i data-lucide="cookie" class="w-3.5 h-3.5 text-amber"></i>
                <span>Crumbs: <strong id="score-display" class="text-terracotta text-sm">0</strong></span>
            </div>
            <button id="audio-toggle-btn" class="btn-retro bg-cream hover:bg-cream/80 vintage-border p-2 rounded-xl shadow-retro-sm flex items-center gap-1 font-mono text-xs font-bold">
                <i data-lucide="volume-2" class="w-4 h-4 text-terracotta"></i>
                <span id="audio-status" class="hidden md:inline">Sound: ON</span>
            </button>
        </div>
    </header>

    <!-- MAIN GAME LAYOUT -->
    <div class="w-full max-w-6xl flex-1 grid grid-cols-1 lg:grid-cols-12 gap-3 items-center justify-center overflow-hidden my-auto">
        
        <!-- LEFT/CENTER: 3D MIRROR CONTAINER -->
        <main class="lg:col-span-7 flex flex-col items-center justify-center relative">
            
            <div class="relative bg-charcoal p-2.5 sm:p-5 rounded-[2rem] sm:rounded-[2.5rem] vintage-border shadow-retro-lg flex flex-col items-center transition-all duration-300">
                
                <div class="absolute -top-3 px-4 py-0.5 bg-amber vintage-border rounded-full shadow-retro-sm z-20">
                    <span class="font-mono text-[9px] sm:text-[10px] font-extrabold text-charcoal uppercase tracking-widest">CPC-CRUMB-8000</span>
                </div>

                <!-- Mirror Canvas Wrapper -->
                <div id="click-canvas-container" class="relative w-[260px] h-[300px] sm:w-[380px] sm:h-[440px] rounded-[1.75rem] sm:rounded-[2rem] overflow-hidden vintage-border bg-gradient-to-b from-slate-800 to-slate-950 cursor-pointer group">
                    
                    <canvas id="mirror-canvas" class="w-full h-full block"></canvas>
                    <div class="glass-overlay absolute inset-0 z-10"></div>
                    <div class="absolute inset-0 z-10 pointer-events-none rounded-[2rem] shadow-[inset_0_0_40px_rgba(0,0,0,0.6)]"></div>

                    <div class="absolute bottom-3 left-1/2 -translate-x-1/2 z-20 bg-cream/90 backdrop-blur-sm vintage-border px-3 py-1 rounded-full font-mono text-[10px] sm:text-[11px] font-bold text-charcoal pointer-events-none">
                        ✨ Tap Mirror to Feed & Collect! ✨
                    </div>

                    <div id="pigeon-thought" class="absolute top-3 left-1/2 -translate-x-1/2 z-20 bg-cream vintage-border px-3 py-1 rounded-lg shadow-retro-sm font-mono text-xs font-bold text-charcoal opacity-0 transition-all duration-300 pointer-events-none">
                        *Coo!*
                    </div>
                </div>

                <!-- BRASS TITLE PLATE -->
                <div class="mt-2.5 w-full brass-plate vintage-border rounded-xl px-3 py-1.5 text-center shadow-retro-sm">
                    <h1 class="font-heading font-extrabold text-sm sm:text-lg text-charcoal tracking-wider uppercase leading-none drop-shadow-sm">
                        CPS: <span id="cps-display">0.0</span> CRUMBS / SEC
                    </h1>
                </div>

            </div>

        </main>

        <!-- RIGHT: CLICKER SHOP & UPGRADES -->
        <aside class="lg:col-span-5 bg-cream vintage-border rounded-[1.75rem] sm:rounded-[2rem] p-3.5 sm:p-5 shadow-retro-lg flex flex-col h-[230px] sm:h-[480px]">
            <div class="flex items-center justify-between mb-2 pb-1.5 border-b-2 border-charcoal">
                <h2 class="font-heading font-extrabold text-sm sm:text-lg uppercase flex items-center gap-1.5">
                    <i data-lucide="shopping-bag" class="w-4 h-4 sm:w-5 sm:h-5 text-terracotta"></i> Pigeon Market
                </h2>
                <span class="font-mono text-[10px] sm:text-xs font-bold bg-amber/20 px-2 py-0.5 rounded-lg vintage-border">Upgrades</span>
            </div>

            <!-- Shop Items List -->
            <div id="shop-list" class="flex-1 overflow-y-auto space-y-2.5 pr-1"></div>
        </aside>

    </div>

    <!-- INTERACTIVE PIGEON CONTROLS FOOTER -->
    <footer class="w-full max-w-5xl z-10 mt-1 sm:mt-2">
        <div class="bg-cream vintage-border p-2 sm:p-3 rounded-2xl shadow-retro-lg flex flex-wrap items-center justify-center gap-2">
            
            <button id="act-peck" class="btn-retro bg-terracotta hover:bg-terracotta/90 text-cream font-mono font-bold text-[11px] sm:text-xs px-2.5 py-1.5 sm:px-3 sm:py-2 rounded-xl vintage-border shadow-retro-sm flex items-center gap-1">
                <i data-lucide="hand" class="w-3.5 h-3.5"></i> Peck
            </button>

            <button id="act-tilt" class="btn-retro bg-amber hover:bg-amber/90 text-charcoal font-mono font-bold text-[11px] sm:text-xs px-2.5 py-1.5 sm:px-3 sm:py-2 rounded-xl vintage-border shadow-retro-sm flex items-center gap-1">
                <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i> Tilt
            </button>

            <button id="act-coo" class="btn-retro bg-sage hover:bg-sage/90 text-cream font-mono font-bold text-[11px] sm:text-xs px-2.5 py-1.5 sm:px-3 sm:py-2 rounded-xl vintage-border shadow-retro-sm flex items-center gap-1">
                <i data-lucide="music" class="w-3.5 h-3.5"></i> Coo
            </button>

            <button id="toggle-shades" class="btn-retro bg-cream hover:bg-cream/80 text-charcoal font-mono font-bold text-[11px] sm:text-xs px-2.5 py-1.5 sm:px-3 sm:py-2 rounded-xl vintage-border shadow-retro-sm flex items-center gap-1">
                <i data-lucide="glasses" class="w-3.5 h-3.5 text-terracotta"></i> Shades
            </button>

        </div>
    </footer>

    <script>
        lucide.createIcons();

        /* ===================================================
           GAME STATE & ECONOMY
           =================================================== */
        let game = {
            crumbs: 0,
            totalEarned: 0,
            clickPower: 1,
            cps: 0,
            buildings: {
                crumbFountain: { name: 'Crumb Fountain', cost: 15, cps: 0.5, owned: 0, icon: 'droplet' },
                parkBench: { name: 'Park Bench', cost: 100, cps: 4, owned: 0, icon: 'armchair' },
                breadTruck: { name: 'Bread Delivery Truck', cost: 1100, cps: 32, owned: 0, icon: 'truck' },
                sourdoughFactory: { name: 'Sourdough Factory', cost: 12000, cps: 260, owned: 0, icon: 'factory' },
                pigeonGod: { name: 'Statue of the Mega Pigeon', cost: 130000, cps: 1400, owned: 0, icon: 'landmark' }
            }
        };

        /* ===================================================
           AUDIO SYNTHESIZER
           =================================================== */
        let audioCtx = null;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playCooSound() {
            if (!soundEnabled) return;
            initAudio();
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                const now = audioCtx.currentTime;
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(220, now + 0.4);
                osc.frequency.exponentialRampToValueAtTime(180, now + 0.7);
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.3, now + 0.1);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.75);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.8);
            } catch (e) {}
        }

        function playPeckSound() {
            if (!soundEnabled) return;
            initAudio();
            try {
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(1200, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.05);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.06);
            } catch (e) {}
        }

        document.getElementById('audio-toggle-btn').addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            document.getElementById('audio-status').innerText = soundEnabled ? 'Sound: ON' : 'Sound: OFF';
            if (soundEnabled) initAudio();
        });


        /* ===================================================
           THREE.JS 3D PIGEON SCENE SETUP
           =================================================== */
        const canvas = document.getElementById('mirror-canvas');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x181A1D);

        const camera = new THREE.PerspectiveCamera(45, canvas.clientWidth / canvas.clientHeight, 0.1, 100);
        camera.position.set(0, 0.5, 3.8);

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
        renderer.setSize(canvas.clientWidth, canvas.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const spotLight = new THREE.SpotLight(0xffffff, 1.2);
        spotLight.position.set(2, 4, 3);
        spotLight.castShadow = true;
        scene.add(spotLight);

        const rimLight = new THREE.DirectionalLight(0xE6A11D, 0.8);
        rimLight.position.set(-3, 2, -2);
        scene.add(rimLight);

        /* --- PIGEON MESH HIERARCHY --- */
        const pigeonGroup = new THREE.Group();
        scene.add(pigeonGroup);

        const featherMaterial = new THREE.MeshStandardMaterial({ color: 0x808a95, roughness: 0.6, metalness: 0.1 });
        const neckIridescentMaterial = new THREE.MeshStandardMaterial({ color: 0x4a8d7c, roughness: 0.3, metalness: 0.4 });
        const beakMaterial = new THREE.MeshStandardMaterial({ color: 0x2b2b2b, roughness: 0.4 });
        const eyeMaterial = new THREE.MeshBasicMaterial({ color: 0xff6600 });
        const pupilMaterial = new THREE.MeshBasicMaterial({ color: 0x000000 });

        const bodyGeo = new THREE.SphereGeometry(0.75, 24, 24);
        bodyGeo.scale(0.85, 1.0, 1.15);
        const bodyMesh = new THREE.Mesh(bodyGeo, featherMaterial);
        bodyMesh.castShadow = true;
        pigeonGroup.add(bodyMesh);

        const wingGeo = new THREE.ConeGeometry(0.5, 1.2, 16);
        wingGeo.rotateX(Math.PI / 2);
        wingGeo.scale(0.3, 0.7, 1.0);

        const leftWing = new THREE.Mesh(wingGeo, featherMaterial);
        leftWing.position.set(0.65, 0.1, -0.1);
        leftWing.rotation.z = -Math.PI / 8;
        pigeonGroup.add(leftWing);

        const rightWing = new THREE.Mesh(wingGeo, featherMaterial);
        rightWing.position.set(-0.65, 0.1, -0.1);
        rightWing.rotation.z = Math.PI / 8;
        pigeonGroup.add(rightWing);

        const neckHeadGroup = new THREE.Group();
        neckHeadGroup.position.set(0, 0.45, 0.4);
        pigeonGroup.add(neckHeadGroup);

        const neckGeo = new THREE.CylinderGeometry(0.32, 0.42, 0.4, 16);
        const neckMesh = new THREE.Mesh(neckGeo, neckIridescentMaterial);
        neckMesh.position.y = 0.1;
        neckHeadGroup.add(neckMesh);

        const headGeo = new THREE.SphereGeometry(0.38, 20, 20);
        const headMesh = new THREE.Mesh(headGeo, featherMaterial);
        headMesh.position.set(0, 0.35, 0.05);
        neckHeadGroup.add(headMesh);

        const beakGeo = new THREE.ConeGeometry(0.08, 0.32, 12);
        beakGeo.rotateX(Math.PI / 2);
        const beakMesh = new THREE.Mesh(beakGeo, beakMaterial);
        beakMesh.position.set(0, 0.3, 0.48);
        neckHeadGroup.add(beakMesh);

        const cereGeo = new THREE.SphereGeometry(0.06, 10, 10);
        const cereMaterial = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.8 });
        const cereMesh = new THREE.Mesh(cereGeo, cereMaterial);
        cereMesh.position.set(0, 0.34, 0.4);
        neckHeadGroup.add(cereMesh);

        const eyeGeo = new THREE.SphereGeometry(0.07, 12, 12);
        const pupilGeo = new THREE.SphereGeometry(0.04, 12, 12);

        const leftEye = new THREE.Mesh(eyeGeo, eyeMaterial);
        leftEye.position.set(0.3, 0.38, 0.22);
        const leftPupil = new THREE.Mesh(pupilGeo, pupilMaterial);
        leftPupil.position.set(0.33, 0.38, 0.26);
        neckHeadGroup.add(leftEye, leftPupil);

        const rightEye = new THREE.Mesh(eyeGeo, eyeMaterial);
        rightEye.position.set(-0.3, 0.38, 0.22);
        const rightPupil = new THREE.Mesh(pupilGeo, pupilMaterial);
        rightPupil.position.set(-0.33, 0.38, 0.26);
        neckHeadGroup.add(rightEye, rightPupil);

        const shadesGroup = new THREE.Group();
        const glassLensMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1, metalness: 0.9, emissive: 0x111111 });
        const frameMat = new THREE.MeshStandardMaterial({ color: 0xD95D39, roughness: 0.2, metalness: 0.5 });
        
        const lensGeo = new THREE.BoxGeometry(0.3, 0.2, 0.08);
        const leftLens = new THREE.Mesh(lensGeo, glassLensMat);
        leftLens.position.set(0.22, 0.38, 0.35);
        
        const rightLens = new THREE.Mesh(lensGeo, glassLensMat);
        rightLens.position.set(-0.22, 0.38, 0.35);

        const bridge = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.05, 0.06), frameMat);
        bridge.position.set(0, 0.44, 0.35);

        const templeGeo = new THREE.BoxGeometry(0.04, 0.04, 0.4);
        const leftTemple = new THREE.Mesh(templeGeo, frameMat);
        leftTemple.position.set(0.36, 0.38, 0.18);
        leftTemple.rotation.y = 0.2;

        const rightTemple = new THREE.Mesh(templeGeo, frameMat);
        rightTemple.position.set(-0.36, 0.38, 0.18);
        rightTemple.rotation.y = -0.2;

        shadesGroup.add(leftLens, rightLens, bridge, leftTemple, rightTemple);
        shadesGroup.visible = false;
        neckHeadGroup.add(shadesGroup);

        // OrbitControls optimized for touch & drag
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.1;
        controls.minDistance = 2.0;
        controls.maxDistance = 5.5;
        controls.enableZoom = true;


        /* ===================================================
           CLICKING, TOUCH & ANIMATION LOGIC
           =================================================== */
        let time = 0;
        let isPecking = false;
        let peckProgress = 0;
        let isTilting = false;
        let tiltTargetAngle = 0;
        let currentTilt = 0;

        const thoughtBubble = document.getElementById('pigeon-thought');

        function showThought(text) {
            thoughtBubble.innerText = text;
            thoughtBubble.classList.remove('opacity-0');
            thoughtBubble.classList.add('opacity-100');
            setTimeout(() => {
                thoughtBubble.classList.remove('opacity-100');
                thoughtBubble.classList.add('opacity-0');
            }, 1800);
        }

        // Unified trigger for feeding crumbs (works for both mouse click and touch taps)
        function triggerFeed(clientX, clientY) {
            game.crumbs += game.clickPower;
            game.totalEarned += game.clickPower;
            playPeckSound();

            isPecking = true;
            peckProgress = 0;
            
            spawnFloatingCrumb(clientX, clientY, `+${game.clickPower}`);
            updateDisplay();
        }

        const clickContainer = document.getElementById('click-canvas-container');

        // Mouse click handler
        clickContainer.addEventListener('click', (e) => {
            triggerFeed(e.clientX, e.clientY);
        });

        // Touch event handler (prevents ghost clicks and handles mobile taps cleanly)
        let touchStartedX = 0;
        let touchStartedY = 0;

        clickContainer.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                touchStartedX = e.touches[0].clientX;
                touchStartedY = e.touches[0].clientY;
            }
        }, { passive: true });

        clickContainer.addEventListener('touchend', (e) => {
            if (e.changedTouches.length === 1) {
                const distX = Math.abs(e.changedTouches[0].clientX - touchStartedX);
                const distY = Math.abs(e.changedTouches[0].clientY - touchStartedY);
                
                // If it was a tap and not a drag/orbit gesture
                if (distX < 10 && distY < 10) {
                    triggerFeed(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
                }
            }
        }, { passive: true });

        function spawnFloatingCrumb(x, y, text) {
            const el = document.createElement('div');
            el.innerText = text;
            el.className = 'fixed z-50 font-mono font-extrabold text-amber text-sm pointer-events-none transition-all duration-700 ease-out';
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            document.body.appendChild(el);

            setTimeout(() => {
                el.style.transform = `translateY(-50px) scale(1.2)`;
                el.style.opacity = '0';
            }, 20);

            setTimeout(() => {
                el.remove();
            }, 750);
        }

        // Action Buttons
        document.getElementById('act-peck').addEventListener('click', () => {
            isPecking = true;
            peckProgress = 0;
            playPeckSound();
            showThought('*Peck!*');
        });

        document.getElementById('act-tilt').addEventListener('click', () => {
            isTilting = true;
            tiltTargetAngle = (Math.random() > 0.5 ? 1 : -1) * (0.4 + Math.random() * 0.4);
            showThought('???');
        });

        document.getElementById('act-coo').addEventListener('click', () => {
            playCooSound();
            showThought('♪ Cooooo~ ♪');
        });

        document.getElementById('toggle-shades').addEventListener('click', (e) => {
            shadesGroup.visible = !shadesGroup.visible;
            e.currentTarget.classList.toggle('bg-amber');
            showThought(shadesGroup.visible ? 'Cool & collected.' : 'Shades off.');
        });


        /* ===================================================
           SHOP & UPGRADE RENDERING
           =================================================== */
        function renderShop() {
            const shopList = document.getElementById('shop-list');
            shopList.innerHTML = '';

            for (const [key, b] of Object.entries(game.buildings)) {
                const canAfford = game.crumbs >= b.cost;
                const itemEl = document.createElement('div');
                itemEl.className = `p-2.5 rounded-xl vintage-border flex items-center justify-between transition-all ${canAfford ? 'bg-cream hover:bg-amber/10 cursor-pointer shadow-retro-sm' : 'bg-cream/40 opacity-70 cursor-not-allowed'}`;
                
                itemEl.innerHTML = `
                    <div class="flex items-center gap-2.5">
                        <div class="w-8 h-8 rounded-lg bg-charcoal text-cream flex items-center justify-center vintage-border">
                            <i data-lucide="${b.icon}" class="w-4 h-4 text-amber"></i>
                        </div>
                        <div>
                            <h4 class="font-heading font-extrabold text-xs sm:text-sm">${b.name}</h4>
                            <p class="font-mono text-[10px] sm:text-[11px] text-charcoal/70">+${b.cps} CPS</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <span class="font-mono font-extrabold text-[11px] sm:text-xs text-terracotta block">${Math.floor(b.cost)}</span>
                        <span class="font-mono text-[9px] bg-charcoal text-cream px-1.5 py-0.5 rounded-md">Owned: ${b.owned}</span>
                    </div>
                `;

                if (canAfford) {
                    itemEl.addEventListener('click', () => {
                        game.crumbs -= b.cost;
                        b.owned++;
                        b.cost *= 1.15;
                        recalculateCPS();
                        renderShop();
                        updateDisplay();
                    });
                }

                shopList.appendChild(itemEl);
            }
            lucide.createIcons();
        }

        function recalculateCPS() {
            let totalCPS = 0;
            for (const b of Object.values(game.buildings)) {
                totalCPS += b.owned * b.cps;
            }
            game.cps = totalCPS;
        }

        function updateDisplay() {
            document.getElementById('score-display').innerText = Math.floor(game.crumbs).toLocaleString();
            document.getElementById('cps-display').innerText = game.cps.toFixed(1);
        }


        /* ===================================================
           GAME LOOP
           =================================================== */
        let lastTick = performance.now();

        function gameLoop(now) {
            requestAnimationFrame(gameLoop);
            const delta = (now - lastTick) / 1000;
            if (delta >= 0.1) {
                if (game.cps > 0) {
                    game.crumbs += game.cps * delta;
                    game.totalEarned += game.cps * delta;
                    updateDisplay();
                    renderShop();
                }
                lastTick = now;
            }

            time += 0.04;
            pigeonGroup.position.y = Math.sin(time * 2) * 0.03;

            if (!isPecking && !isTilting) {
                const headBob = Math.pow(Math.sin(time * 3), 5) * 0.12;
                neckHeadGroup.position.z = 0.4 + headBob;
                neckHeadGroup.rotation.z = Math.sin(time * 0.5) * 0.05;
            }

            if (isPecking) {
                peckProgress += 0.15;
                neckHeadGroup.position.z = 0.4 + Math.sin(peckProgress) * 0.45;
                neckHeadGroup.rotation.x = Math.sin(peckProgress) * 0.5;

                if (peckProgress >= Math.PI) {
                    isPecking = false;
                    neckHeadGroup.rotation.x = 0;
                }
            }

            if (isTilting) {
                currentTilt += (tiltTargetAngle - currentTilt) * 0.15;
                neckHeadGroup.rotation.z = currentTilt;

                if (Math.abs(tiltTargetAngle - currentTilt) < 0.02) {
                    setTimeout(() => {
                        tiltTargetAngle = 0;
                        if (Math.abs(currentTilt) < 0.02) isTilting = false;
                    }, 600);
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            const width = canvas.clientWidth;
            const height = canvas.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });

        window.onload = function() {
            renderShop();
            updateDisplay();
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
